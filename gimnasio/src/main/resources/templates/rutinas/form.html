<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera}"></head>
<body>
	<nav th:replace="~{fragments/layout :: menu}"></nav>
	
	<div class="container">
	    <h2 th:text="${rutina.id == null} ? 'Nueva rutina' : 'Editar rutina'"></h2>
	
	    <form th:action="@{/rutinas/guardar}" th:object="${rutina}" method="post" class="mt-3">
			<div class="alert alert-danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
	        <input type="hidden" th:field="*{id}">
	
	        <div class="mb-3">
	            <label for="nombre" class="form-label">Nombre</label>
	            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
	                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
	            <div class="invalid-feedback" th:errors="*{nombre}"></div>
	        </div>
	
	        <div class="mb-3">
	            <label for="descripcion" class="form-label">Descripción</label>
	            <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3"
	                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
	            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
	        </div>
	
	        <div class="mb-3">
	            <label for="nivel" class="form-label">Nivel</label>
	            <select id="nivel" th:field="*{nivel}" class="form-select"
	                    th:classappend="${#fields.hasErrors('nivel')} ? 'is-invalid'">
	                <option value="">Elige un nivel</option>
	                <option th:each="n : ${niveles}" th:value="${n}" th:text="${n}"></option>
	            </select>
	            <div class="invalid-feedback" th:errors="*{nivel}"></div>
	        </div>
	
	        <button type="submit" class="btn btn-success">Guardar</button>
	        <a th:href="@{/rutinas}" class="btn btn-secondary">Cancelar</a>
	    </form>
	</div>
</body>
</html>
