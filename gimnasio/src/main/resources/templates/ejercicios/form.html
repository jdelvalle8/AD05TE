<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera}"></head>
<body>
	<nav th:replace="~{fragments/layout :: menu}"></nav>
	
	<div class="container">
	    <h2 th:text="${ejercicio.id == null} ? 'Nuevo ejercicio' : 'Editar ejercicio'"></h2>
	
	    <form th:action="@{/ejercicios/guardar}" th:object="${ejercicio}" method="post" class="mt-3">
	        <input type="hidden" th:field="*{id}">
	
	        <div class="mb-3">
	            <label for="nombre" class="form-label">Nombre</label>
	            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
	                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
	            <div class="invalid-feedback" th:errors="*{nombre}"></div>
	        </div>
	
	        <div class="mb-3">
	            <label for="series" class="form-label">Series</label>
	            <input type="number" id="series" th:field="*{series}" class="form-control"
	                   th:classappend="${#fields.hasErrors('series')} ? 'is-invalid'">
	            <div class="invalid-feedback" th:errors="*{series}"></div>
	        </div>
	
	        <div class="mb-3">
	            <label for="repeticiones" class="form-label">Repeticiones</label>
	            <input type="number" id="repeticiones" th:field="*{repeticiones}" class="form-control"
	                   th:classappend="${#fields.hasErrors('repeticiones')} ? 'is-invalid'">
	            <div class="invalid-feedback" th:errors="*{repeticiones}"></div>
	        </div>
	
	        <div class="mb-3">
	            <label for="rutina" class="form-label">Rutina</label>
	            <select id="rutina" name="rutina.id" class="form-select"
	                    th:classappend="${#fields.hasErrors('rutina')} ? 'is-invalid'">
	                <option value="">Elige una rutina</option>
	                <option th:each="r : ${rutinas}" th:value="${r.id}" th:text="${r.nombre}"
	                        th:selected="${ejercicio.rutina != null and ejercicio.rutina.id == r.id}"></option>
	            </select>
	            <div class="invalid-feedback" th:errors="*{rutina}"></div>
	        </div>
	
	        <button type="submit" class="btn btn-success">Guardar</button>
	        <a th:href="@{/ejercicios}" class="btn btn-secondary">Cancelar</a>
	    </form>
	</div>
</body>
</html>
