<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

	<nav th:fragment="menu" class="navbar navbar-expand navbar-dark bg-dark mb-4">
	    <div class="container">
	        <a class="navbar-brand" th:href="@{/}">Gimnasio</a>
	        <div class="navbar-nav">
	            <a class="nav-link" th:href="@{/rutinas}">Rutinas</a>
	            <a class="nav-link" th:href="@{/ejercicios}">Ejercicios</a>
	        </div>
	    </div>
	</nav>
	
	<div th:fragment="avisos">
	    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
	    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
	</div>

</body>
</html>
